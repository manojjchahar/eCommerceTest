# ============================================
# GITLAB CI/CD PIPELINE
# E-Commerce Test Automation Framework
# Mirrors Azure DevOps Pipeline Functionality
# ============================================

# ============================================
# PIPELINE INPUTS (appear in Run Pipeline UI)
# ============================================
spec:
  inputs:
    cucumberTags:
      description: 'Cucumber Tags (Quick Select)'
      type: string
      default: '@eCommFull'
      options:
        - '@eCommFull'
        - '@UI'
        - '@API'
        - '@smoke'
        - '@Products'
        - '@Cart'
        - '@Authentication'
    cucumberCustomTags:
      description: 'Custom Tags (overrides dropdown if provided, e.g. @UI and @Products)'
      type: string
      default: ''
    browser:
      description: 'Browser for UI Tests'
      type: string
      default: 'chrome'
      options:
        - 'chrome'
        - 'firefox'
        - 'edge'
    headless:
      description: 'Run in Headless Mode'
      type: boolean
      default: true
    parallelThreads:
      description: 'Parallel Threads'
      type: string
      default: '2'
      options:
        - '1'
        - '2'
        - '4'
    retryCount:
      description: 'Retry Failed Tests'
      type: string
      default: '1'
      options:
        - '0'
        - '1'
        - '2'
        - '3'
    executionMode:
      description: 'Execution Mode'
      type: string
      default: 'selenium-service'
      options:
        - 'local'              # Self-hosted runner with given browser
        - 'selenium-service'   # Built-in sidecar container (shared runners)
        - 'grid'               # External LambdaTest cloud Grid

---

# ============================================
# WORKFLOW RULES (Triggers)
# ============================================
workflow:
  name: '$CI_PIPELINE_SOURCE - $CI_COMMIT_REF_NAME - $[[ inputs.cucumberTags ]]'
  rules:
    # CI Trigger - Push to main/develop
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
    # MR Trigger
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Manual/Web Trigger
    - if: $CI_PIPELINE_SOURCE == "web"
    # Scheduled Trigger
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ============================================
# DEFAULT SETTINGS
# ============================================
default:
  image: maven:3.9-eclipse-temurin-21
  # Note: Removed 'tags: docker' - GitLab.com shared runners work without tags

# ============================================
# VARIABLES (use inputs for manual runs, defaults for CI/scheduled)
# ============================================
variables:
  # Maven Configuration
  MAVEN_OPTS: "-Xmx1024m -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end"
  
  # Test Configuration (from inputs - defaults defined in spec section)
  CUCUMBER_TAGS: $[[ inputs.cucumberTags ]]
  CUCUMBER_CUSTOM_TAGS: $[[ inputs.cucumberCustomTags ]]
  BROWSER: $[[ inputs.browser ]]
  HEADLESS: $[[ inputs.headless ]]
  PARALLEL_THREADS: $[[ inputs.parallelThreads ]]
  RETRY_COUNT: $[[ inputs.retryCount ]]
  EXECUTION_MODE: $[[ inputs.executionMode ]]
  
  # Timeouts
  WAIT_SHORT_TIMEOUT: "25"
  WAIT_LONG_TIMEOUT: "35"
  WAIT_POLLING_MILLIS: "750"
  
  # Grid Configuration (set dynamically in before_script based on EXECUTION_MODE)
  # local = empty (WebDriverManager on self-hosted runner)
  # selenium-service = http://selenium:4444 (built-in sidecar)
  # grid = set GRID_URL in CI/CD Variables for external lambdaTest cloud grid
  GRID_URL: ""
  
  # Report Directories
  ALLURE_REPORT_DIR: "target/site/allure-maven-plugin"
  ALLURE_RESULTS_DIR: "target/allure-results"

# ============================================
# CACHE CONFIGURATION
# ============================================
cache:
  key: "${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}"
  paths:
    - .m2/repository/
  policy: pull-push

# ============================================
# STAGES 
# ============================================
stages:
  - test
  - report

# ============================================
# STAGE 1: TEST EXECUTION
# ============================================
# SCHEDULED RUNS: Create in GitLab UI (Settings → CI/CD → Schedules)
# Mon=Chrome, Tue=Firefox, Wed=Edge, Thu=Chrome, Fri=Firefox, Sat=Edge, Sun=Chrome

# Job for LOCAL execution (self-hosted Windows runner)
test-local:
  stage: test
  tags:
    - local
    - windows
  # Conditional rules: Push/MR = strict, Manual/Scheduled = warning
  rules:
    # Push to main/develop - STRICT (red on failure)
    - if: $EXECUTION_MODE == "local" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")
      allow_failure: false
    # MR - STRICT (red on failure)
    - if: $EXECUTION_MODE == "local" && $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: false
    # Manual/Web - TOLERANT (yellow on failure)
    - if: $EXECUTION_MODE == "local" && $CI_PIPELINE_SOURCE == "web"
      allow_failure: true
    # Scheduled - TOLERANT (yellow on failure)
    - if: $EXECUTION_MODE == "local" && $CI_PIPELINE_SOURCE == "schedule"
      allow_failure: true
    # Default for other cases
    - if: $EXECUTION_MODE == "local"
      allow_failure: true
  cache:
    key: "local-${CI_COMMIT_REF_SLUG}"
    paths:
      - .m2/repository/
  
  before_script:
    - echo "========================================"
    - echo "  LOCAL MODE - Self-hosted Windows Runner"
    - echo "========================================"
    - echo "Selected Browser - $env:BROWSER"
    - echo "Using WebDriverManager to auto-download driver"
    - java -version
    - mvn --version
    - echo "========================================"
  
  script:
    - mvn compile "-DskipTests" --batch-mode -q
    - |
      # Determine which tags to use
      if ($env:CUCUMBER_CUSTOM_TAGS) {
        $effectiveTags = $env:CUCUMBER_CUSTOM_TAGS
        Write-Host "Using CUSTOM tags: $effectiveTags"
      } else {
        $effectiveTags = $env:CUCUMBER_TAGS
        Write-Host "Using DROPDOWN tags: $effectiveTags"
      }
      mvn verify --batch-mode --errors "-Dtest=ParallelTestRunner" "-Dcucumber.filter.tags=$effectiveTags" "-Dbrowser=$env:BROWSER" "-Ddataproviderthreadcount=$env:PARALLEL_THREADS" "-Dheadless=$env:HEADLESS" "-Dwait.short.timeout=$env:WAIT_SHORT_TIMEOUT" "-Dwait.long.timeout=$env:WAIT_LONG_TIMEOUT" "-Dwait.polling.millis=$env:WAIT_POLLING_MILLIS" "-Dretry.count=$env:RETRY_COUNT" "-Dsurefire.rerunFailingTestsCount=$env:RETRY_COUNT" "-Dallure.results.directory=$env:ALLURE_RESULTS_DIR"
  
  artifacts:
    when: always
    paths:
      - target/
    reports:
      junit: target/surefire-reports/TEST-*.xml
    expire_in: 7 days

# Job for SELENIUM-SERVICE and GRID execution (shared runners)
test:
  stage: test
  # Conditional rules: Push/MR = strict, Manual/Scheduled = warning
  rules:
    # Skip if local execution mode
    - if: $EXECUTION_MODE == "local"
      when: never
    # Push to main/develop - STRICT (red on failure)
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      allow_failure: false
    # MR - STRICT (red on failure)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: false
    # Manual/Web - TOLERANT (yellow on failure)
    - if: $CI_PIPELINE_SOURCE == "web"
      allow_failure: true
    # Scheduled - TOLERANT (yellow on failure)
    - if: $CI_PIPELINE_SOURCE == "schedule"
      allow_failure: true
    # Default
    - when: always
      allow_failure: true
  services:
    # Dynamic Selenium service based on selected browser (chrome/firefox/edge)
    - name: selenium/standalone-$BROWSER:4.27.0
      alias: selenium
      # Required for browser stability on shared runners
      variables:
        SE_START_XVFB: "false"
        SE_NODE_MAX_SESSIONS: "2"
        START_XVFB: "false"
  
  before_script:
    # Override dropdown selection if custom tags provided
    - |
      if [ -n "$CUCUMBER_CUSTOM_TAGS" ]; then
        export CUCUMBER_TAGS="$CUCUMBER_CUSTOM_TAGS"
        echo "Using CUSTOM tags: $CUCUMBER_TAGS"
      else
        echo "Using dropdown tags: $CUCUMBER_TAGS"
      fi
    
    # Set GRID_URL based on execution mode
    # - local: Self-hosted runner with selected browser (GRID_URL empty)
    # - selenium-service: Built-in sidecar container (shared runners)
    # - grid: External LambdaTest cloud Grid
    - |
      echo "========================================"
      echo "  EXECUTION MODE: $EXECUTION_MODE"
      echo "========================================"
      case $EXECUTION_MODE in
        "local")
          # Requires self-hosted runner with selected browser installed
          export GRID_URL=""
          echo "Local mode - using WebDriverManager"
          echo "NOTE: Works on self-hosted runners with selected browser"
          ;;
        "selenium-service")
          # Built-in sidecar container (works on shared runners)
          export GRID_URL="http://selenium:4444"
          echo "Using Selenium service at $GRID_URL"
          ;;
        "grid")
          # External LambdaTest cloud Grid - GRID_URL must be set in CI/CD variables
          if [ -z "$GRID_URL" ]; then
            echo "ERROR: GRID_URL variable not set!"
            echo "Set GRID_URL in CI/CD Variables (Settings → CI/CD → Variables)"
            echo "Example: http://selenium-grid.your-cluster.com:4444"
            exit 1
          fi
          echo "Using external Selenium Grid at $GRID_URL"
          ;;
        *)
          # Default to selenium-service
          export GRID_URL="http://selenium:4444"
          ;;
      esac
      echo "Grid URL: ${GRID_URL:-'(empty - local mode)'}"
    
    # Wait for Selenium Grid to be ready (only for selenium-service modes)
    - |
      if [ -n "$GRID_URL" ]; then
        # Check if this is a cloud provider (skip local debugging)
        if echo "$GRID_URL" | grep -qE "(lambdatest|browserstack|saucelabs)"; then
          echo "========================================"
          echo "  CLOUD SELENIUM GRID DETECTED"
          echo "========================================"
          echo "Provider: Cloud-based (always ready)"
          echo "Skipping local connectivity checks..."
          echo "✅ Cloud Grid is ready!"
        else
          # Local or selenium-service - do connectivity checks
          echo "========================================"
          echo "  WAITING FOR SELENIUM GRID"
          echo "========================================"
          MAX_RETRIES=30
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # Use /status endpoint (works for most grids)
            if curl -s "$GRID_URL/status" 2>/dev/null | grep -q '"ready": true'; then
              echo "✅ Selenium Grid is ready!"
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Waiting for Selenium Grid... ($RETRY_COUNT/$MAX_RETRIES)"
            sleep 2
          done
          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "❌ Selenium Grid failed to start!"
            curl -v "$GRID_URL/status" 2>&1 || echo "Cannot reach Grid"
            exit 1
          fi
        fi
      fi
    
    # Set browser for scheduled cross-browser runs (matches Azure logic)
    - |
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ]; then
        DAY_OF_WEEK=$(date +%u)
        case $DAY_OF_WEEK in
          1) export BROWSER="chrome" ;;   # Monday
          2) export BROWSER="firefox" ;;  # Tuesday
          3) export BROWSER="edge" ;;     # Wednesday
          4) export BROWSER="chrome" ;;   # Thursday
          5) export BROWSER="firefox" ;;  # Friday
          6) export BROWSER="edge" ;;     # Saturday
          7) export BROWSER="chrome" ;;   # Sunday
          *) export BROWSER="chrome" ;;
        esac
        echo "========================================"
        echo "  SCHEDULED CROSS-BROWSER TEST"
        echo "========================================"
        echo "Day of Week: $DAY_OF_WEEK"
        echo "Browser:     $BROWSER"
        echo "========================================"
      fi
    - echo "========================================"
    - echo "  PIPELINE TRIGGER INFO"
    - echo "========================================"
    - echo "Source  - $CI_PIPELINE_SOURCE"
    - echo "Branch  - $CI_COMMIT_REF_NAME"
    - echo "Commit  - $CI_COMMIT_SHORT_SHA"
    - echo "Pipeline- $CI_PIPELINE_ID"
    - echo "========================================"
    - echo "  ENVIRONMENT"
    - echo "========================================"
    - java -version
    - mvn --version
    - echo "========================================"
    - echo "  TEST CONFIGURATION"
    - echo "========================================"
    - echo "Tags    - $CUCUMBER_TAGS"
    - echo "Browser - $BROWSER"
    - echo "Headless- $HEADLESS"
    - echo "Threads - $PARALLEL_THREADS"
    - echo "Retry   - $RETRY_COUNT"
    - echo "========================================"
  
  script:
    # Compile
    - mvn compile -DskipTests $MAVEN_CLI_OPTS -q
    
    # Run Tests - Use CUCUMBER_CUSTOM_TAGS if provided, otherwise CUCUMBER_TAGS
    - |
      # Determine which tags to use
      if [ -n "$CUCUMBER_CUSTOM_TAGS" ]; then
        EFFECTIVE_TAGS="$CUCUMBER_CUSTOM_TAGS"
        echo "Using CUSTOM tags: $EFFECTIVE_TAGS"
      else
        EFFECTIVE_TAGS="$CUCUMBER_TAGS"
        echo "Using DROPDOWN tags: $EFFECTIVE_TAGS"
      fi
      
      mvn verify $MAVEN_CLI_OPTS -Dtest=ParallelTestRunner -Dcucumber.filter.tags="$EFFECTIVE_TAGS" -Dbrowser=$BROWSER -Ddataproviderthreadcount=$PARALLEL_THREADS -Dheadless=$HEADLESS -Dwait.short.timeout=$WAIT_SHORT_TIMEOUT -Dwait.long.timeout=$WAIT_LONG_TIMEOUT -Dwait.polling.millis=$WAIT_POLLING_MILLIS -DgridUrl=$GRID_URL -Dretry.count=$RETRY_COUNT -Dsurefire.rerunFailingTestsCount=$RETRY_COUNT -Dallure.results.directory=$ALLURE_RESULTS_DIR || true
  
  after_script:
    - echo "Test execution completed"
  
  artifacts:
    name: "test-output-${CI_JOB_ID}"
    when: always
    paths:
      - target/
    reports:
      junit: target/surefire-reports/TEST-*.xml
    expire_in: 7 days

# ============================================
# STAGE 2: GENERATE REPORTS
# ============================================
report:
  stage: report
  needs:
    - job: test
      artifacts: true
      optional: true
    - job: test-local
      artifacts: true
      optional: true
  
  script:
    - echo "Generating Allure Report..."
    - mvn allure:report -DskipTests $MAVEN_CLI_OPTS -q || true
    - echo "Report generation completed"
  
  artifacts:
    name: "reports-${CI_JOB_ID}"
    when: always
    paths:
      - target/cucumber-reports/
      - target/extent/
      - $ALLURE_REPORT_DIR/
      - $ALLURE_RESULTS_DIR/
    expire_in: 30 days
  
  when: always
  allow_failure: true

# ============================================
# GITLAB PAGES (View Allure Report Online)
# ============================================
pages:
  stage: report
  needs:
    - job: report
      artifacts: true
  
  script:
    - mkdir -p public
    - cp -r $ALLURE_REPORT_DIR/* public/ || echo "No Allure report to publish"
    - echo "Allure report published to GitLab Pages"
  
  artifacts:
    paths:
      - public
    expire_in: 30 days
  
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
  
  allow_failure: true

# ============================================
# SCHEDULED PIPELINES
# Configure in GitLab UI: Settings > CI/CD > Schedules
# 
# Nightly (Daily 2:00 AM IST / 8:30 PM UTC previous day):
#   Cron: 30 20 * * *
#   Branch: develop or main
#   Variables: CUCUMBER_TAGS = @eCommFull
# ============================================
