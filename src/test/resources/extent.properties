# Enable Extent Spark adapter and set output file
extent.reporter.spark.start=true
extent.reporter.spark.out=target/extent/ExtentReport.html


# Optional screenshots folder (used by hooks/adapters if needed)
screenshot.dir=target/extent/screenshots
screenshot.rel.path=./screenshots

# Add some basic system info
systeminfo.os=${os.name}
systeminfo.java.version=${java.version}
systeminfo.user=${user.name}
