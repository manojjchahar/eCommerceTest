# GitLab CI/CD Pipeline for eCommerceTest Framework
# Equivalent to azure-pipelines.yml

# Trigger on main and master branches
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

# Default image with Java 21
image: maven:3.9-eclipse-temurin-21

# Variables (equivalent to Azure DevOps variables)
variables:
  MAVEN_OPTS: "-Xmx1024m -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --show-version"
  JAVA_VERSION: "21"
  MAVEN_GOALS: "clean verify"
  CUCUMBER_TAGS: "@ui"
  BROWSER: "chrome"
  DATAPROVIDERTHREADCOUNT: "2"
  HEADLESS: "true"
  WAIT_SHORT_TIMEOUT: "25"
  WAIT_LONG_TIMEOUT: "35"
  WAIT_POLLING_MILLIS: "750"
  GRID_URL: ""  # Set to your Grid hub URL to enable remote execution
  RETRY_COUNT: "1"
  ALLURE_REPORT_DIR: "target/site/allure-maven-plugin"
  ALLURE_RESULTS_DIR: "target/allure-results"

# Cache Maven dependencies to speed up builds
cache:
  key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/

stages:
  - test
  - report

# Main test job
test:
  stage: test
  services:
    - name: selenium/standalone-chrome:latest
      alias: selenium
  before_script:
    - java -version
    - mvn --version
  script:
    - >
      mvn $MAVEN_CLI_OPTS $MAVEN_GOALS
      -Dtest=ParallelTestRunner
      -Dcucumber.filter.tags="$CUCUMBER_TAGS"
      -Dbrowser=$BROWSER
      -Ddataproviderthreadcount=$DATAPROVIDERTHREADCOUNT
      -Dheadless=$HEADLESS
      -Dwait.short.timeout=$WAIT_SHORT_TIMEOUT
      -Dwait.long.timeout=$WAIT_LONG_TIMEOUT
      -Dwait.polling.millis=$WAIT_POLLING_MILLIS
      -DgridUrl=$GRID_URL
      -Dretry.count=$RETRY_COUNT
      -Dsurefire.rerunFailingTestsCount=$RETRY_COUNT
      -Dallure.results.directory=$ALLURE_RESULTS_DIR
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
      - target/cucumber-reports/
      - target/extent-reports/
      - $ALLURE_RESULTS_DIR/
    reports:
      junit: target/surefire-reports/*.xml
    expire_in: 7 days

# Generate and publish Allure report
allure-report:
  stage: report
  needs:
    - job: test
      artifacts: true
  script:
    - mvn allure:report -DskipTests
  artifacts:
    when: always
    paths:
      - $ALLURE_REPORT_DIR/
      - $ALLURE_RESULTS_DIR/
    expire_in: 30 days
  allow_failure: true

# Optional: Deploy Allure report to GitLab Pages
pages:
  stage: report
  needs:
    - job: allure-report
      artifacts: true
  script:
    - mkdir -p public
    - cp -r $ALLURE_REPORT_DIR/* public/
  artifacts:
    paths:
      - public
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
  allow_failure: true
