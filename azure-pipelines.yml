# ============================================
# ON-DEMAND PARAMETERS (for manual/scheduled runs)
# ============================================
parameters:
  - name: cucumberTags
    displayName: 'Cucumber Tags to Run'
    type: string
    default: '@eCommFull'
    values:
      - '@eCommFull'
      - '@UI'
      - '@API'
      - '@Authentication'
      - '@Products'
      - '@Cart'
      - '@ProductsAPI'
      - '@BrandsAPI'
      - '@DataDrivenAPI'
      - '@AuthenticationAPI'
      - '@UI and @Authentication'
      - '@UI and @Products'
      - '@UI and @Cart'
      - '@API and @ProductsAPI'
      - '@API and @BrandsAPI'

  - name: browser
    displayName: 'Browser'
    type: string
    default: 'chrome'
    values:
      - 'chrome'
      - 'firefox'
      - 'edge'

  - name: headless
    displayName: 'Run Headless'
    type: boolean
    default: true

  - name: parallelThreads
    displayName: 'Parallel Thread Count'
    type: number
    default: 2
    values:
      - 1
      - 2
      - 4
      - 6

  - name: retryCount
    displayName: 'Retry Failed Tests Count'
    type: number
    default: 1
    values:
      - 0
      - 1
      - 2
      - 3

# ============================================
# TRIGGERS
# ============================================

# CI Trigger - on push to main/master
trigger:
  branches:
    include:
      - main
      - master

# PR Trigger - on pull requests
pr:
  branches:
    include:
      - main
      - master

# Scheduled Triggers - Nightly and Weekly
schedules:
  # Nightly run - Every weekday at 2:00 AM IST (8:30 PM UTC previous day)
  # Runs BOTH UI and API tests
  - cron: '30 20 * * 0-4'
    displayName: 'Nightly Full Tests (Mon-Fri 2:00 AM IST)'
    branches:
      include:
        - main
        - master
    always: false  # Only run if there are changes
    batch: true

  # Weekly Full Suite - Every Saturday at 3:00 AM IST (9:30 PM UTC Friday)
  - cron: '30 21 * * 5'
    displayName: 'Weekly Full Suite (Sat 3:00 AM IST)'
    branches:
      include:
        - main
        - master
    always: true  # Run even if no changes
    batch: true

# ============================================
# POOL & VARIABLES
# ============================================
pool:
  name: 'Default'

variables:
  MAVEN_OPTS: '-Xmx1024m'
  JAVA_VERSION: '21'
  MAVEN_GOALS: 'clean verify'
  # Use parameter values if manually triggered, otherwise use defaults
  ${{ if eq(variables['Build.Reason'], 'Schedule') }}:
    # All scheduled runs use @eCommFull (full suite - both UI and API)
    cucumberTags: '@eCommFull'
  ${{ elseif eq(variables['Build.Reason'], 'Manual') }}:
    cucumberTags: '${{ parameters.cucumberTags }}'
  ${{ else }}:
    # CI/PR triggers run UI tests only (faster feedback)
    cucumberTags: '@UI'
  browser: '${{ parameters.browser }}'
  dataproviderthreadcount: '${{ parameters.parallelThreads }}'
  headless: '${{ parameters.headless }}'
  waitShortTimeout: '25'
  waitLongTimeout: '35'
  waitPollingMillis: '750'
  gridUrl: '' # set to your Grid hub URL to enable remote execution
  retryCount: '${{ parameters.retryCount }}'
  allureReportDir: 'target/site/allure-maven-plugin'
  allureResultsDir: 'target/allure-results'

steps:
  - task: JavaToolInstaller@0
    displayName: 'Install Java $(JAVA_VERSION)'
    inputs:
      versionSpec: '$(JAVA_VERSION)'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'

  # Cache the local Maven repository to speed up builds
  - task: Cache@2
    inputs:
      key: 'maven | "$(Agent.OS)" | **/pom.xml'
      restoreKeys: |
        maven | "$(Agent.OS)"
      path: '$(UserProfile)\/.m2\/repository'

  - task: Maven@3
    inputs:
      mavenPomFile: 'pom.xml'
      goals: '$(MAVEN_GOALS)'
      options: >
        -Dtest=ParallelTestRunner \
        -Dcucumber.filter.tags=$(cucumberTags) \
        -Dbrowser=$(browser) \
        -Ddataproviderthreadcount=$(dataproviderthreadcount) \
        -Dheadless=$(headless) \
        -Dwait.short.timeout=$(waitShortTimeout) \
        -Dwait.long.timeout=$(waitLongTimeout) \
        -Dwait.polling.millis=$(waitPollingMillis) \
        -DgridUrl=$(gridUrl) \
        -Dretry.count=$(retryCount) \
        -Dsurefire.rerunFailingTestsCount=$(retryCount) \
        -Dallure.results.directory=$(allureResultsDir)
      publishJUnitResults: true
      testResultsFiles: '**/surefire-reports/*.xml'
      javaHomeOption: 'JDKVersion'
      jdkVersionOption: '$(JAVA_VERSION)'
      mavenOptions: '-Xmx1024m'
      sonarQubeRunAnalysis: false
      sqMavenPluginVersionChoice: 'latest'

  - script: mvn allure:report -DskipTests
    displayName: 'Generate Allure Report'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Cucumber, Extent, Allure results'
    inputs:
      PathtoPublish: 'target'
      ArtifactName: 'reports'
      publishLocation: 'Container'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Allure Report (HTML)'
    condition: succeeded()
    inputs:
      PathtoPublish: '$(allureReportDir)'
      ArtifactName: 'allure-report'
      publishLocation: 'Container'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Allure Raw Results'
    condition: succeeded()
    inputs:
      PathtoPublish: '$(allureResultsDir)'
      ArtifactName: 'allure-results'
      publishLocation: 'Container'
