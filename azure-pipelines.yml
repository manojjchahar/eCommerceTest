# ============================================
# AZURE DEVOPS PIPELINE
# E-Commerce Test Automation Framework
# Two-Stage Pipeline with Artifact Passing
# ============================================

# Run naming: shows trigger type, date, and tags
name: '$(Date:yyyyMMdd)-$(Rev:r)-$(Build.Reason)-$(Build.SourceBranchName)'

# ============================================
# PARAMETERS
# ============================================
parameters:
  - name: cucumberTags
    displayName: 'Cucumber Tags to Run'
    type: string
    default: '@eCommFull'
    values:
      - '@eCommFull'
      - '@UI'
      - '@API'
      - '@Authentication'
      - '@Products'
      - '@Cart'
      - '@ProductsAPI'
      - '@BrandsAPI'
      - '@DataDrivenAPI'
      - '@AuthenticationAPI'
      - '@UI and @Authentication'
      - '@UI and @Products'
      - '@UI and @Cart'
      - '@API and @ProductsAPI'
      - '@API and @BrandsAPI'

  - name: browser
    displayName: 'Browser'
    type: string
    default: 'chrome'
    values:
      - 'chrome'
      - 'firefox'
      - 'edge'

  - name: headless
    displayName: 'Run Headless'
    type: boolean
    default: true

  - name: parallelThreads
    displayName: 'Parallel Thread Count'
    type: number
    default: 2
    values:
      - 1
      - 2
      - 4
      - 6

  - name: retryCount
    displayName: 'Retry Failed Tests Count'
    type: number
    default: 1
    values:
      - 0
      - 1
      - 2
      - 3

  - name: executionMode
    displayName: 'Execution Mode'
    type: string
    default: 'local'
    values:
      - 'local'   # WebDriverManager - run on agent
      - 'docker'  # Docker Compose Grid - localhost:4444
      - 'grid'    # External Grid URL

# ============================================
# TRIGGERS
# ============================================
trigger:
  branches:
    include:
      - master

pr:
  branches:
    include:
      - master

schedules:
  # Daily 3-Browser Rotation @ 2:00 AM IST
  # Mon=Chrome, Tue=Firefox, Wed=Edge, Thu=Chrome, Fri=Firefox, Sat=Edge, Sun=Chrome
  - cron: '30 20 * * *'
    displayName: 'Daily Cross-Browser Tests (2:00 AM IST)'
    branches:
      include:
        - develop
    always: true
    batch: true

# ============================================
# VARIABLES
# ============================================
variables:
  MAVEN_OPTS: '-Xmx1024m'
  # Tags based on trigger
  ${{ if eq(variables['Build.Reason'], 'Schedule') }}:
    cucumberTags: '@eCommFull'
  ${{ elseif eq(variables['Build.Reason'], 'Manual') }}:
    cucumberTags: '${{ parameters.cucumberTags }}'
  ${{ else }}:
    cucumberTags: '@UI'
  # Browser: For scheduled runs, will be set by script based on day
  # For manual runs, use parameter
  browser: '${{ parameters.browser }}'
  dataproviderthreadcount: '${{ parameters.parallelThreads }}'
  headless: '${{ parameters.headless }}'
  waitShortTimeout: '25'
  waitLongTimeout: '35'
  waitPollingMillis: '750'
  # Grid URL based on execution mode
  ${{ if eq(parameters.executionMode, 'docker') }}:
    gridUrl: 'http://localhost:4444'
  ${{ elseif eq(parameters.executionMode, 'grid') }}:
    gridUrl: 'http://selenium-grid:4444'  # Override in pipeline run
  ${{ else }}:
    gridUrl: ''  # Local - WebDriverManager
  executionMode: '${{ parameters.executionMode }}'
  retryCount: '${{ parameters.retryCount }}'
  allureReportDir: 'target/site/allure-maven-plugin'
  allureResultsDir: 'target/allure-results'

# ============================================
# STAGES
# ============================================
stages:
  # ==========================================
  # STAGE 1: TEST EXECUTION
  # ==========================================
  - stage: TestExecution
    displayName: '🧪 Test Execution'
    jobs:
      - job: RunTests
        displayName: 'Build & Run Tests'
        # Conditional pool: Scheduled = Microsoft-hosted, Manual/CI = Self-hosted
        ${{ if eq(variables['Build.Reason'], 'Schedule') }}:
          pool:
            vmImage: 'ubuntu-latest'
          variables:
            executionMode: 'grid'
            gridUrl: 'http://localhost:4444'
        ${{ else }}:
          pool:
            name: 'Default'
        steps:
          # Set browser for scheduled cross-browser runs
          # Daily 3-browser rotation starting Monday: Chrome → Firefox → Edge
          - powershell: |
              $dayOfWeek = (Get-Date).DayOfWeek.value__
              $buildReason = "$(Build.Reason)"
              
              if ($buildReason -eq "Schedule") {
                # Mon=Chrome, Tue=Firefox, Wed=Edge, Thu=Chrome, Fri=Firefox, Sat=Edge, Sun=Chrome
                switch ($dayOfWeek) {
                  1 { $browser = "chrome" }   # Monday
                  2 { $browser = "firefox" }  # Tuesday
                  3 { $browser = "edge" }     # Wednesday
                  4 { $browser = "chrome" }   # Thursday
                  5 { $browser = "firefox" }  # Friday
                  6 { $browser = "edge" }     # Saturday
                  0 { $browser = "chrome" }   # Sunday
                  default { $browser = "chrome" }
                }
                Write-Host "##vso[task.setvariable variable=browser]$browser"
                Write-Host "========================================"
                Write-Host "  SCHEDULED CROSS-BROWSER TEST"
                Write-Host "========================================"
                Write-Host "Day of Week: $dayOfWeek"
                Write-Host "Browser:     $browser"
                Write-Host "========================================"
              } else {
                Write-Host "Manual/CI run - Using parameter browser: $(browser)"
              }
            displayName: '🌐 Set Browser for Scheduled Runs'
            condition: always()

          # Setup
          - script: |
              echo ========================================
              echo   ENVIRONMENT
              echo ========================================
              echo JAVA_HOME=%JAVA_HOME%
              java -version
              mvn -version
              echo ========================================
              echo Browser: $(browser)
              echo Tags: $(cucumberTags)
              echo ========================================
            displayName: '☕ Verify Environment'

          # Note: Cache@2 task removed - self-hosted agent already has persistent .m2 folder
          # Maven dependencies are stored at: C:\Users\<user>\.m2\repository
          # Once downloaded, they're reused across all pipeline runs automatically

          # Start Selenium Grid via Docker for SCHEDULED runs (Linux agent)
          - ${{ if eq(variables['Build.Reason'], 'Schedule') }}:
            - bash: |
                echo "========================================"
                echo "  STARTING SELENIUM GRID (Scheduled Run)"
                echo "========================================"
                echo "Browser: $(browser)"
                
                # Stop any existing containers
                docker-compose down --remove-orphans 2>/dev/null || true
                
                # Start only the required services based on browser
                browser=$(echo "$(browser)" | tr '[:upper:]' '[:lower:]')
                case $browser in
                  chrome)
                    docker-compose up -d selenium-hub chrome
                    echo "Started: selenium-hub + chrome node"
                    ;;
                  firefox)
                    docker-compose up -d selenium-hub firefox
                    echo "Started: selenium-hub + firefox node"
                    ;;
                  edge)
                    docker-compose up -d selenium-hub edge
                    echo "Started: selenium-hub + edge node"
                    ;;
                  *)
                    docker-compose up -d selenium-hub chrome
                    echo "Started: selenium-hub + chrome node (default)"
                    ;;
                esac
                
                # Wait for Selenium Grid to be ready
                echo "Waiting for Selenium Grid to be ready..."
                maxRetries=30
                retryCount=0
                while [ $retryCount -lt $maxRetries ]; do
                  if curl -s "http://localhost:4444/wd/hub/status" 2>/dev/null | grep -q '"ready": true'; then
                    echo "✅ Selenium Grid is ready!"
                    docker-compose ps
                    break
                  fi
                  retryCount=$((retryCount + 1))
                  echo "Waiting... ($retryCount/$maxRetries)"
                  sleep 2
                done
                
                if [ $retryCount -eq $maxRetries ]; then
                  echo "❌ Selenium Grid failed to start!"
                  docker-compose logs
                  exit 1
                fi
              displayName: '🐳 Start Selenium Grid (Scheduled - Linux)'
          - ${{ if eq(parameters.executionMode, 'docker') }}:
            - powershell: |
                Write-Host "========================================"
                Write-Host "  STARTING SELENIUM GRID (Docker Mode)"
                Write-Host "========================================"
                Write-Host "Browser: $(browser)"
                
                # Stop any existing containers
                docker-compose down --remove-orphans 2>$null
                
                # Start only the required services based on browser
                $browser = "$(browser)".ToLower()
                switch ($browser) {
                  "chrome" { 
                    docker-compose up -d selenium-hub chrome
                    Write-Host "Started: selenium-hub + chrome node"
                  }
                  "firefox" { 
                    docker-compose up -d selenium-hub firefox
                    Write-Host "Started: selenium-hub + firefox node"
                  }
                  "edge" { 
                    docker-compose up -d selenium-hub edge
                    Write-Host "Started: selenium-hub + edge node"
                  }
                  default {
                    docker-compose up -d selenium-hub chrome
                    Write-Host "Started: selenium-hub + chrome node (default)"
                  }
                }
                
                # Wait for Selenium Grid to be ready
                Write-Host "Waiting for Selenium Grid to be ready..."
                $maxRetries = 30
                $retryCount = 0
                while ($retryCount -lt $maxRetries) {
                  try {
                    $response = Invoke-WebRequest -Uri "http://localhost:4444/wd/hub/status" -UseBasicParsing -TimeoutSec 5
                    $status = $response.Content | ConvertFrom-Json
                    if ($status.value.ready -eq $true) {
                      Write-Host "✅ Selenium Grid is ready!"
                      Write-Host "Grid URL: http://localhost:4444"
                      Write-Host "Grid UI:  http://localhost:4444/ui"
                      break
                    }
                  } catch {
                    Write-Host "Waiting... ($retryCount/$maxRetries)"
                  }
                  Start-Sleep -Seconds 2
                  $retryCount++
                }
                
                if ($retryCount -eq $maxRetries) {
                  Write-Host "❌ Selenium Grid failed to start!"
                  docker-compose logs
                  exit 1
                }
                
                # Show running containers
                docker-compose ps
              displayName: '🐳 Start Selenium Grid (Docker)'
              workingDirectory: '$(System.DefaultWorkingDirectory)'

          # Build
          - script: mvn compile -DskipTests -B -q
            displayName: '🔨 Compile'
            env:
              MAVEN_OPTS: '$(MAVEN_OPTS)'

          # Test - SCHEDULED RUNS (Linux/bash)
          - ${{ if eq(variables['Build.Reason'], 'Schedule') }}:
            - bash: |
                echo "========================================"
                echo "  TEST CONFIG (Scheduled)"
                echo "========================================"
                echo "Tags: $(cucumberTags)"
                echo "Browser: $(browser)"
                echo "Headless: $(headless)"
                echo "Threads: $(dataproviderthreadcount)"
                echo "Grid URL: http://localhost:4444"
                echo "========================================"
                
                mvn verify \
                  -Dtest=ParallelTestRunner \
                  -Dcucumber.filter.tags="$(cucumberTags)" \
                  -Dbrowser=$(browser) \
                  -Ddataproviderthreadcount=$(dataproviderthreadcount) \
                  -Dheadless=$(headless) \
                  -Dwait.short.timeout=$(waitShortTimeout) \
                  -Dwait.long.timeout=$(waitLongTimeout) \
                  -Dwait.polling.millis=$(waitPollingMillis) \
                  -DgridUrl=http://localhost:4444 \
                  -Dretry.count=$(retryCount) \
                  -Dsurefire.rerunFailingTestsCount=$(retryCount) \
                  -Dallure.results.directory=$(allureResultsDir) \
                  -B
              displayName: '🧪 Run Tests (Scheduled - Linux)'
              continueOnError: true
              env:
                MAVEN_OPTS: '$(MAVEN_OPTS)'

          # Test - MANUAL/CI RUNS (Windows/PowerShell)
          - ${{ if ne(variables['Build.Reason'], 'Schedule') }}:
            - powershell: |
                Write-Host "========================================"
                Write-Host "  TEST CONFIG"
                Write-Host "========================================"
                Write-Host "Tags: $(cucumberTags)"
                Write-Host "Browser: $(browser)"
                Write-Host "Headless: $(headless)"
                Write-Host "Threads: $(dataproviderthreadcount)"
                Write-Host "Execution Mode: $(executionMode)"
                Write-Host "Grid URL: [$(gridUrl)]"
                Write-Host "========================================"
                
                # Build Maven command - conditionally include gridUrl only if not empty
                $gridUrlArg = ""
                if ("$(gridUrl)" -ne "") {
                  $gridUrlArg = "-DgridUrl=$(gridUrl)"
                  Write-Host "Using Remote Grid: $(gridUrl)"
                } else {
                  Write-Host "Using Local ChromeDriver via WebDriverManager"
                }
                
                mvn verify "-Dtest=ParallelTestRunner" "-Dcucumber.filter.tags=$(cucumberTags)" "-Dbrowser=$(browser)" "-Ddataproviderthreadcount=$(dataproviderthreadcount)" "-Dheadless=$(headless)" "-Dwait.short.timeout=$(waitShortTimeout)" "-Dwait.long.timeout=$(waitLongTimeout)" "-Dwait.polling.millis=$(waitPollingMillis)" $gridUrlArg "-Dretry.count=$(retryCount)" "-Dsurefire.rerunFailingTestsCount=$(retryCount)" "-Dallure.results.directory=$(allureResultsDir)" -B
              displayName: '🧪 Run Tests'
              # Conditional: Manual = warning, CI/PR = fail
              ${{ if eq(variables['Build.Reason'], 'Manual') }}:
                continueOnError: true
              ${{ else }}:
                continueOnError: false
              env:
                MAVEN_OPTS: '$(MAVEN_OPTS)'

          # Publish JUnit Results
          - task: PublishTestResults@2
            displayName: '📊 Publish Test Results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              mergeTestResults: true
              failTaskOnFailedTests: false
              testRunTitle: '$(cucumberTags) - $(browser)'

          # Upload target folder as pipeline artifact for next stage
          - task: PublishPipelineArtifact@1
            displayName: '📤 Upload Test Artifacts'
            condition: always()
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/target'
              artifact: 'test-output'
              publishLocation: 'pipeline'

          # Stop Selenium Grid containers (only for docker execution mode)
          - ${{ if eq(parameters.executionMode, 'docker') }}:
            - powershell: |
                Write-Host "========================================"
                Write-Host "  STOPPING SELENIUM GRID (Docker Mode)"
                Write-Host "========================================"
                docker-compose down --remove-orphans
                Write-Host "✅ All Selenium Grid containers stopped"
              displayName: '🐳 Stop Selenium Grid (Docker)'
              condition: always()
              workingDirectory: '$(System.DefaultWorkingDirectory)'

  # ==========================================
  # STAGE 2: GENERATE REPORTS
  # ==========================================
  - stage: Reports
    displayName: '📈 Generate Reports'
    dependsOn: TestExecution
    condition: succeededOrFailed()
    jobs:
      - job: GenerateReports
        displayName: 'Generate & Publish Reports'
        pool:
          name: 'Default'
        steps:
          # Download artifacts from previous stage
          - task: DownloadPipelineArtifact@2
            displayName: '📥 Download Test Artifacts'
            inputs:
              artifact: 'test-output'
              path: '$(System.DefaultWorkingDirectory)/target'

          # Note: No cache task needed - self-hosted agent has persistent .m2 folder

          # Generate Allure Report
          - script: mvn allure:report -DskipTests -B -q
            displayName: '📊 Generate Allure Report'
            continueOnError: true

          # Publish Reports
          - task: PublishBuildArtifacts@1
            displayName: '📁 Publish Cucumber Reports'
            condition: always()
            continueOnError: true
            inputs:
              PathtoPublish: 'target/cucumber-reports'
              ArtifactName: 'cucumber-reports'

          - task: PublishBuildArtifacts@1
            displayName: '📁 Publish Extent Reports'
            condition: always()
            continueOnError: true
            inputs:
              PathtoPublish: 'target/extent'
              ArtifactName: 'extent-reports'

          - task: PublishBuildArtifacts@1
            displayName: '📊 Publish Allure Report'
            condition: always()
            continueOnError: true
            inputs:
              PathtoPublish: '$(allureReportDir)'
              ArtifactName: 'allure-report'

          - task: PublishBuildArtifacts@1
            displayName: '📊 Publish Allure Results'
            condition: always()
            continueOnError: true
            inputs:
              PathtoPublish: '$(allureResultsDir)'
              ArtifactName: 'allure-results'

          # Summary
          - script: |
              echo.
              echo ========================================
              echo   PIPELINE COMPLETE
              echo ========================================
              echo Tags: $(cucumberTags)
              echo Browser: $(browser)
              echo.
              echo Published Artifacts:
              echo   - cucumber-reports
              echo   - extent-reports
              echo   - allure-report
              echo   - allure-results
              echo ========================================
            displayName: '✅ Summary'
            condition: always()
