# ============================================
# AZURE DEVOPS PIPELINE
# E-Commerce Test Automation Framework
# ============================================

# ============================================
# ON-DEMAND PARAMETERS
# ============================================
parameters:
  - name: cucumberTags
    displayName: 'Cucumber Tags to Run'
    type: string
    default: '@eCommFull'
    values:
      - '@eCommFull'
      - '@UI'
      - '@API'
      - '@Authentication'
      - '@Products'
      - '@Cart'
      - '@ProductsAPI'
      - '@BrandsAPI'
      - '@DataDrivenAPI'
      - '@AuthenticationAPI'
      - '@UI and @Authentication'
      - '@UI and @Products'
      - '@UI and @Cart'
      - '@API and @ProductsAPI'
      - '@API and @BrandsAPI'

  - name: browser
    displayName: 'Browser'
    type: string
    default: 'chrome'
    values:
      - 'chrome'
      - 'firefox'
      - 'edge'

  - name: headless
    displayName: 'Run Headless'
    type: boolean
    default: true

  - name: parallelThreads
    displayName: 'Parallel Thread Count'
    type: number
    default: 2
    values:
      - 1
      - 2
      - 4
      - 6

  - name: retryCount
    displayName: 'Retry Failed Tests Count'
    type: number
    default: 1
    values:
      - 0
      - 1
      - 2
      - 3

# ============================================
# TRIGGERS
# ============================================
trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - main
      - master

schedules:
  - cron: '30 20 * * 0-4'
    displayName: 'Nightly Full Tests (Mon-Fri 2:00 AM IST)'
    branches:
      include:
        - main
        - master
    always: false
    batch: true

  - cron: '30 21 * * 5'
    displayName: 'Weekly Full Suite (Sat 3:00 AM IST)'
    branches:
      include:
        - main
        - master
    always: true
    batch: true

# ============================================
# VARIABLES
# ============================================
variables:
  MAVEN_OPTS: '-Xmx1024m'
  JAVA_VERSION: '21'
  ${{ if eq(variables['Build.Reason'], 'Schedule') }}:
    cucumberTags: '@eCommFull'
  ${{ elseif eq(variables['Build.Reason'], 'Manual') }}:
    cucumberTags: '${{ parameters.cucumberTags }}'
  ${{ else }}:
    cucumberTags: '@UI'
  browser: '${{ parameters.browser }}'
  dataproviderthreadcount: '${{ parameters.parallelThreads }}'
  headless: '${{ parameters.headless }}'
  waitShortTimeout: '25'
  waitLongTimeout: '35'
  waitPollingMillis: '750'
  gridUrl: ''
  retryCount: '${{ parameters.retryCount }}'
  allureReportDir: 'target/site/allure-maven-plugin'
  allureResultsDir: 'target/allure-results'

# ============================================
# STAGES
# ============================================
stages:
  # ==========================================
  # STAGE: TEST EXECUTION
  # ==========================================
  - stage: TestExecution
    displayName: '🧪 Test Execution'
    jobs:
      - job: RunTests
        displayName: 'Run Cucumber Tests'
        pool:
          name: 'Default'
        steps:
          # ---- SETUP ----
          - script: |
              echo ========================================
              echo   ENVIRONMENT CHECK
              echo ========================================
              echo JAVA_HOME=%JAVA_HOME%
              java -version
              echo.
              mvn -version
              echo ========================================
            displayName: '☕ Verify Java & Maven'

          # Cache (non-blocking)
          - task: Cache@2
            displayName: '📦 Cache Maven Dependencies'
            continueOnError: true
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: '$(UserProfile)/.m2/repository'

          # ---- BUILD ----
          - script: mvn compile -DskipTests -B -q
            displayName: '🔨 Compile Project'
            env:
              MAVEN_OPTS: '$(MAVEN_OPTS)'

          # ---- TEST ----
          - script: |
              echo ========================================
              echo   TEST CONFIGURATION
              echo ========================================
              echo Tags: $(cucumberTags)
              echo Browser: $(browser)
              echo Headless: $(headless)
              echo Threads: $(dataproviderthreadcount)
              echo Retry: $(retryCount)
              echo ========================================
              echo.
              mvn verify ^
                -Dtest=ParallelTestRunner ^
                -Dcucumber.filter.tags="$(cucumberTags)" ^
                -Dbrowser=$(browser) ^
                -Ddataproviderthreadcount=$(dataproviderthreadcount) ^
                -Dheadless=$(headless) ^
                -Dwait.short.timeout=$(waitShortTimeout) ^
                -Dwait.long.timeout=$(waitLongTimeout) ^
                -Dwait.polling.millis=$(waitPollingMillis) ^
                -DgridUrl=$(gridUrl) ^
                -Dretry.count=$(retryCount) ^
                -Dsurefire.rerunFailingTestsCount=$(retryCount) ^
                -Dallure.results.directory=$(allureResultsDir) ^
                -B
            displayName: '🧪 Run Tests'
            env:
              MAVEN_OPTS: '$(MAVEN_OPTS)'
            continueOnError: true

          # ---- PUBLISH TEST RESULTS ----
          - task: PublishTestResults@2
            displayName: '📊 Publish Test Results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              mergeTestResults: true
              failTaskOnFailedTests: false
              testRunTitle: 'Cucumber - $(cucumberTags) - $(browser)'

  # ==========================================
  # STAGE: REPORTS
  # ==========================================
  - stage: Reports
    displayName: '📈 Generate Reports'
    dependsOn: TestExecution
    condition: succeededOrFailed()
    jobs:
      - job: GenerateReports
        displayName: 'Generate & Publish Reports'
        pool:
          name: 'Default'
        steps:
          # Generate Allure Report
          - script: |
              echo Generating Allure Report...
              mvn allure:report -DskipTests -B -q
            displayName: '📊 Generate Allure Report'
            continueOnError: true

          # Publish Cucumber Reports
          - task: PublishBuildArtifacts@1
            displayName: '📁 Publish Cucumber Reports'
            condition: always()
            continueOnError: true
            inputs:
              PathtoPublish: 'target/cucumber-reports'
              ArtifactName: 'cucumber-reports'
              publishLocation: 'Container'

          # Publish Extent Reports
          - task: PublishBuildArtifacts@1
            displayName: '📁 Publish Extent Reports'
            condition: always()
            continueOnError: true
            inputs:
              PathtoPublish: 'target/extent-reports'
              ArtifactName: 'extent-reports'
              publishLocation: 'Container'

          # Publish Allure HTML Report
          - task: PublishBuildArtifacts@1
            displayName: '📊 Publish Allure Report'
            condition: always()
            continueOnError: true
            inputs:
              PathtoPublish: '$(allureReportDir)'
              ArtifactName: 'allure-report'
              publishLocation: 'Container'

          # Publish Allure Results
          - task: PublishBuildArtifacts@1
            displayName: '📊 Publish Allure Results'
            condition: always()
            continueOnError: true
            inputs:
              PathtoPublish: '$(allureResultsDir)'
              ArtifactName: 'allure-results'
              publishLocation: 'Container'

          # Summary
          - script: |
              echo.
              echo ========================================
              echo   PIPELINE COMPLETE
              echo ========================================
              echo Tags: $(cucumberTags)
              echo Browser: $(browser)
              echo.
              echo Artifacts Published:
              echo   - cucumber-reports
              echo   - extent-reports  
              echo   - allure-report
              echo   - allure-results
              echo ========================================
            displayName: '✅ Summary'
            condition: always()
